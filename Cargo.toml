[workspace]
resolver = "2"
members = ["crates/capture", "crates/league", "crates/engine", "crates/release", "apps/cli", "apps/desktop"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/0xInception/timewarp"

[workspace.dependencies]
timewarp-capture = { path = "crates/capture" }
timewarp-league = { path = "crates/league" }
timewarp-engine = { path = "crates/engine" }
timewarp-release = { path = "crates/release" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
